name: Fetch jobs

on:
  schedule:
    - cron: "23 5 * * *"   # daily, 05:23 UTC (06:23 London in summer, 05:23 in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m radar.fetch
      - name: Commit data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
