name: Fetch jobs

on:
  schedule:
    - cron: "17 1 * * *"   # daily, 01:17 UTC; GitHub often starts scheduled runs hours late, so this leaves a buffer before the 09:12 page sync
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install headless browser (for JavaScript careers pages)
        run: python -m playwright install --with-deps chromium
      - run: python -m radar.fetch
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RENDER: "1"
      - name: Prepare files for the radar page
        run: python -m radar.sync_plan --out data/page
      - name: Commit data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
