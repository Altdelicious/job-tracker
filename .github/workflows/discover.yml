name: Find job boards

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated company names to (re)check; blank = all not yet found"
        required: false
        default: ""
      retry_missing:
        description: "Also retry companies not found last time"
        type: boolean
        default: false
  push:
    paths:
      - config/companies.json
  schedule:
    - cron: "41 5 * * 1"   # weekly, Monday morning

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install headless browser (for JavaScript careers pages)
        run: python -m playwright install --with-deps chromium
      - env:
          ONLY: ${{ github.event.inputs.only }}
          RETRY: ${{ github.event.inputs.retry_missing }}
          EVENT: ${{ github.event_name }}
        run: |
          set --
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          if [ "$RETRY" = "true" ] || [ "$EVENT" = "schedule" ]; then set -- "$@" --retry-missing; fi
          python -m radar.discover "$@"
      - name: Find careers pages on company websites
        env:
          ONLY: ${{ github.event.inputs.only }}
          RENDER: "1"
        run: |
          set --
          if [ -n "$ONLY" ]; then set -- --only "$ONLY"; fi
          python -m radar.sites "$@"
      - run: python -m radar.fetch
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RENDER: "1"
      - name: Prepare files for the radar page
        run: python -m radar.sync_plan --out data/page
      - name: Commit
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add config/boards.json data/
          git diff --cached --quiet || git commit -m "Update job boards $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
